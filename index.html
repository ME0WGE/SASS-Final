<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/styles/style.css" />
    <script
      src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <title>SASS Final Project</title>
  </head>
  <body>
    <!-- SECTION HEADER & NAVBAR -->
    <section>

      <nav class="navbar navbar-expand-lg bg-black">
        <div class="container-fluid d-flex">
          <a class="navbar-brand text-white" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <!-- NAV - DIV - LINKS -->
              <div class="d-flex">
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Home</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >About</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Menu</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Events</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Gallery</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Chefs</a
                >
                <a
                  class="nav-link active text-white"
                  aria-current="page"
                  href="#"
                  >Contact</a
                >
              </div>
              <!-- NAV - DIV - BUTTON -->
              <div>
                <button
                  type="button"
                  class="btn btn-outline-warning text-white"
                >
                  BOOK A TABLE
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>
      <!-- HEADER -->
      <header>
        <div>
          <div>
            <h1>Welcome to <span>CBIENBON</span></h1>
            <h2>Delivering great food for more than 18 years!</h2>
            <div>
              <button type="button" class="btn btn-outline-warning text-white">
                OUR MENU
              </button>
              <button type="button" class="btn btn-outline-warning text-white">
                BOOK A TABLE
              </button>
            </div>
          </div>
          <div>
            <div class="ratio ratio-16x9" style="height: 15vh; width: 15vh">
              <iframe
                src="https://www.youtube.com/embed/zpOULjyy-n8?rel=0"
                title="YouTube video"
                allowfullscreen
              ></iframe>
            </div>
          </div>
        </div>
      </header>
    </section>
    <!-- CONTENT -->
    <!-- FOOTER -->
  </body>
</html>
